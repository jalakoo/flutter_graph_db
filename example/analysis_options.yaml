# Analyzer config for the example app.
#
# Uses `flutter_lints` (widget-aware rules the pure-Dart baseline in
# `../analysis_options.yaml` doesn't carry) but mirrors that baseline's
# strict language modes so the app is held to the same type-safety bar as
# the engine it demonstrates.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Matches the engine baseline: the fixture/bench code favours
    # explicit loops, and mutable state is inherent to the demo.
    prefer_const_constructors: false
    prefer_const_declarations: false
