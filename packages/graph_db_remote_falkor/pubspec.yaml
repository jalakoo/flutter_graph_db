name: graph_db_remote_falkor
description: >-
  RESP-over-Dart adapter for FalkorDB (plan §9.1). Separate package so
  consumers only pull in the Redis dependency when actually targeting
  FalkorDB.
publish_to: none
version: 0.0.1

# Resolved as part of the repo-root pub workspace.
resolution: workspace

repository: https://github.com/jalakoo/flutter_graph_db/tree/main/packages/graph_db_remote_falkor
issue_tracker: https://github.com/jalakoo/flutter_graph_db/issues

environment:
  sdk: ^3.6.0

dependencies:
  graph_db_core:
    path: ../graph_db_core
  graph_db_remote:
    path: ../graph_db_remote
  # No Redis package dependency: the RESP subset FalkorDB needs is
  # implemented in `lib/src/resp/` (framing + `GRAPH.QUERY`), so there is
  # no third-party client in the cone. Not yet validated against a live
  # FalkorDB — unit tests cover the codec only.

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
