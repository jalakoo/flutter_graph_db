name: graph_db_bench
description: >-
  Dev-only benchmark harness for graph_db_core. R-MAT fixture, hub-seed
  traversal selection, latency percentiles, JIT GC-event signal, and the
  Phase-1 read workloads from plan §15. Mirrors SPIKE_A's shape so
  results are directly comparable to the spike record.
publish_to: none
version: 0.0.1

# Resolved as part of the repo-root pub workspace.
resolution: workspace

repository: https://github.com/jalakoo/flutter_graph_db/tree/main/packages/graph_db_bench
issue_tracker: https://github.com/jalakoo/flutter_graph_db/issues

environment:
  sdk: ^3.6.0

dependencies:
  graph_db_core:
    path: ../graph_db_core
  vm_service: ">=11.0.0 <16.0.0"

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
