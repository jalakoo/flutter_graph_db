name: graph_db_wal
description: >-
  WAL schema, CBOR encoding, recovery protocol, and the byte-range
  `WalStore` port (plan §6). Ships in-memory, native (`dart:io`), and
  IndexedDB adapters for both the WAL and snapshots.
publish_to: none
version: 0.0.1

# Resolved as part of the repo-root pub workspace.
resolution: workspace

repository: https://github.com/jalakoo/flutter_graph_db/tree/main/packages/graph_db_wal
issue_tracker: https://github.com/jalakoo/flutter_graph_db/issues

environment:
  sdk: ^3.6.0

dependencies:
  graph_db_core:
    path: ../graph_db_core
  # Pinned per the §13 dependency audit. Wired in Phase 2 once the
  # hot-shape hand-rolled encoders land alongside.
  cbor: ^6.5.1
  xxh3: ^1.2.0
  uuid: ^4.5.0
  # Phase 8 — IndexedDbWalStore uses `package:web` (Dart's modern
  # browser bindings) for the IndexedDB API. Web-only adapter; the
  # rest of the package compiles on every target.
  web: ^1.0.0

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
