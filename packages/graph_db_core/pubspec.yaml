name: graph_db_core
description: >-
  Core engine of the Flutter-native graph database — CSR storage, property
  store, indexes, overlay, applicator, public API, GQL parser/planner/
  executor. Depends on nothing platform-specific.
publish_to: none
version: 0.0.1

# Resolved as part of the repo-root pub workspace.
resolution: workspace

repository: https://github.com/jalakoo/flutter_graph_db/tree/main/packages/graph_db_core
issue_tracker: https://github.com/jalakoo/flutter_graph_db/issues

environment:
  sdk: ^3.6.0

dependencies:
  # `Uuid().v7()` for node/edge logicalIds (plan §6.3, §7.4). Pinned
  # per the §13 dep audit.
  uuid: ^4.5.0

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
