name: graph_db_core
description: >-
  Core engine of the Flutter-native graph database — CSR storage, property
  store, indexes, overlay, applicator, public API, GQL parser/planner/
  executor. Depends on nothing platform-specific.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.5.0

dependencies:
  # `Uuid().v7()` for node/edge logicalIds (plan §6.3, §7.4). Pinned
  # per the §13 dep audit.
  uuid: ^4.5.0

dev_dependencies:
  test: ^1.24.0
  lints: ^4.0.0
