name: graph_db_sync
description: >-
  Push (and eventually bidirectional) sync engine — consumes the WAL
  `WalOp` stream and ships transactions to configured
  `RemoteGraphClient`s (plan §10). Push-only; per-target high-water
  marks persist through a `SyncStateStore`.
publish_to: none
version: 0.0.1

# Resolved as part of the repo-root pub workspace.
resolution: workspace

repository: https://github.com/jalakoo/flutter_graph_db/tree/main/packages/graph_db_sync
issue_tracker: https://github.com/jalakoo/flutter_graph_db/issues

environment:
  sdk: ^3.6.0

dependencies:
  graph_db_core:
    path: ../graph_db_core
  graph_db_wal:
    path: ../graph_db_wal
  graph_db_remote:
    path: ../graph_db_remote

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
