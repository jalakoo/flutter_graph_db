# Repo-root pubspec. Exists so the shared `analysis_options.yaml` at
# this level can resolve `package:lints/recommended.yaml` when
# `dart analyze` or `flutter analyze` is run at the repo root.
#
# This is NOT a published package — the real packages live under
# `packages/` and `example/` and each has its own pubspec.
name: flutter_graph_db_workspace
description: Repo-root resolution shim for shared lints. Not published.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^4.0.0
